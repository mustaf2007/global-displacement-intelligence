name: UNHCR API health check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_unhcr_api.py'
      - '.github/workflows/unhcr-api-health.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  api-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API check dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Check live UNHCR API
        run: python scripts/check_unhcr_api.py
